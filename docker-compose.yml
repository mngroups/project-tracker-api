# Local dependencies for `pnpm dev`. The API itself runs on the host (pnpm dev),
# the auth stand-in via `pnpm dev:issuer`.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: monexa
      POSTGRES_PASSWORD: monexa
      POSTGRES_DB: monexa
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monexa"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9003"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9002:9000", "9003:9003"]
    volumes: [minio-data:/data]

  minio-setup:
    image: minio/mc
    depends_on: [minio]
    restart: "no"
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 minio minio12345; do sleep 1; done;
      mc mb --ignore-existing local/monexa-dev"

volumes:
  postgres-data:
  minio-data:
